{% extends 'hosting/auth_base.html' %}
{% block auth_content %}
<div class="auth-heading"><h1 id="sign-in-title">Welcome back</h1><p>Sign in to your private workspace.</p></div>
<form method="post" class="form card auth-form">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button class="button" type="submit">Sign in</button><p class="auth-link"><a href="{% url 'password_reset' %}">Forgot password?</a></p></form>
{% endblock %}
