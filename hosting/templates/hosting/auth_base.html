{% load static bill_icons %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in · PayBillz{% endblock %}</title>
  <meta name="theme-color" content="#101418">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="{% static 'bills/site.css' %}?v=hosted-login-1">
  <link rel="manifest" href="{% url 'bills:manifest' %}">
  <link rel="icon" type="image/png" href="{% url 'bills:icon_192' %}">
  <link rel="apple-touch-icon" href="{% url 'bills:apple_icon' %}">
  <script src="{% url 'bills:pwa_register' %}" defer></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-panel" aria-labelledby="sign-in-title">
      <div class="brand auth-brand"><span class="brand-mark">{% icon 'checks' %}</span><span>PayBillz<small>A little more settled.</small></span></div>
      {% block auth_content %}{% endblock %}
    </section>
  </main>
</body>
</html>
