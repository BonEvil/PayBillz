name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  application:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PAYBILLZ_DATA_DIR: ${{ github.workspace }}/../paybillz-test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest paybillz.test_recurrence -v
      - run: python manage.py test bills
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python ops-delivery/test_lifecycle.py
      - run: python ops-delivery/test_real_lifecycle.py
