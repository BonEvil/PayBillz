{% extends 'bills/base.html' %}{% block title %}History · PayBillz{% endblock %}{% block content %}<h1>Occurrence history</h1><form method="get" class="filters"><div><label for="q">Bill name</label><input id="q" name="q" value="{{ q }}"></div><div><label for="status">Payment status</label><select id="status" name="status"><option value="all" {% if status == 'all' %}selected{% endif %}>All</option><option value="paid" {% if status == 'paid' %}selected{% endif %}>Paid / completed</option><option value="unpaid" {% if status == 'unpaid' %}selected{% endif %}>Unpaid</option></select></div><div><label for="from">Due from</label><input id="from" name="from" type="date" value="{{ start }}"></div><div><label for="to">Due through</label><input id="to" name="to" type="date" value="{{ end }}"></div><button class="button" type="submit">Filter</button></form>{% include 'bills/rows.html' with rows=rows empty='No matching occurrences.' %}<p class="muted">Showing up to 500 most recent occurrences.</p>{% endblock %}
